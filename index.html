<!DOCTYPE html>
<html>
<head>
  <title>Home - My Portfolio</title>
  <style>
    /* Reset some default browser styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f4f9;
      color: #333;
      line-height: 1.6;
    }

    /* Navigation bar */
    nav {
      background: #2c3e50;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f39c12;
    }

    /* Hero section */
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url("https://picsum.photos/1600/900") no-repeat center center/cover;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 60px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: 22px;
      max-width: 700px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      background: #3498db;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #2980b9;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 15px;
      background: #2c3e50;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="foods.html">Foods</a>
    <a href="timetable.html">Timetable</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Welcome to My Portfolio</h1>
    <p>I’m learning full stack development and this is my professional website.</p>
    <a href="about.html" class="btn">Explore More</a>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 My Portfolio | Designed by Rehan</p>
  </footer>
</body>
</html>
